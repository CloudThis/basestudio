<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a5c"/>
      <stop offset="0.5" stop-color="#ff4f8b"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe9f1"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#3a0d3a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- fond -->
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#shine)"/>
  <!-- base de données (3 disques empilés) -->
  <g filter="url(#shadow)">
    <path d="M62 86 v84 a66 22 0 0 0 132 0 v-84" fill="url(#disc)"/>
    <ellipse cx="128" cy="86" rx="66" ry="22" fill="#ffffff"/>
    <ellipse cx="128" cy="86" rx="50" ry="13" fill="none" stroke="#ff6f8f" stroke-width="5" opacity="0.55"/>
    <path d="M62 114 a66 22 0 0 0 132 0" fill="none" stroke="#ff5f86" stroke-width="7" stroke-linecap="round"/>
    <path d="M62 142 a66 22 0 0 0 132 0" fill="none" stroke="#c45cff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="92" cy="117" r="4.5" fill="#ff5f86"/>
    <circle cx="92" cy="145" r="4.5" fill="#c45cff"/>
    <circle cx="92" cy="173" r="4.5" fill="#7b5cff"/>
  </g>
  <!-- étincelle -->
  <path d="M196 34 C199 52 204 57 222 60 C204 63 199 68 196 86 C193 68 188 63 170 60 C188 57 193 52 196 34 Z" fill="#ffffff"/>
  <circle cx="221" cy="96" r="5" fill="#ffffff" opacity="0.85"/>
